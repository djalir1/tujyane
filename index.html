<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tujyane-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ask Google / browser translators to leave our already-i18n'd UI alone.
         Users can still opt into full-page translation, but auto-translate is
         off by default. The <html lang> attribute is kept in sync with the
         active app language in src/i18n/index.ts. -->
    <meta name="google" content="notranslate" />
    <title>TUJYANE — carpool Rwanda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the initial data-theme before any React paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('tujyane.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
